<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Proportions of Three Categories (Separate Pie Charts)</title>
    <!-- Import ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body {
            padding: 20px;
            background-color: #f9f9f9;
        }
        .charts-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }
        .chart-item {
            width: 300px;
            height: 350px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .chart-title {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2 style="text-align: center; color: #333;">Proportion of Three Hand Issues (Total Mentions: 9 times)</h2>
    <div class="charts-container">
        <!-- Pie Chart 1: Post-exercise hand fatigue accumulation -->
        <div class="chart-item">
            <div class="chart-title">Post-exercise hand fatigue accumulation</div>
            <div id="chart1" style="width: 100%; height: 85%;"></div>
        </div>
        
        <!-- Pie Chart 2: Dependence on caregivers -->
        <div class="chart-item">
            <div class="chart-title">Dependence on caregivers</div>
            <div id="chart2" style="width: 100%; height: 85%;"></div>
        </div>
        
        <!-- Pie Chart 3: Worsening stiffness in cold weather -->
        <div class="chart-item">
            <div class="chart-title">Worsening stiffness in cold weather</div>
            <div id="chart3" style="width: 100%; height: 85%;"></div>
        </div>
    </div>

    <script>
        // Total number of mentions
        const total = 9;
        
        // Data configuration (each category vs. all others)
        const chartData = [
            {
                id: 'chart1',
                name: 'Post-exercise hand fatigue accumulation',
                value: 1,
                docs: 'Only mentioned in Document 2',
                color: ['#409EFF', '#E8F3FF'] // Primary + auxiliary color
            },
            {
                id: 'chart2',
                name: 'Dependence on caregivers',
                value: 5,
                docs: 'Documents 1, 2, 6, 9, 11',
                color: ['#67C23A', '#F0F9E8']
            },
            {
                id: 'chart3',
                name: 'Worsening stiffness in cold weather',
                value: 3,
                docs: 'Documents 1, 7, 9',
                color: ['#F56C6C', '#FEE2E2']
            }
        ];

        // Initialize each pie chart
        chartData.forEach(item => {
            const chartDom = document.getElementById(item.id);
            const myChart = echarts.init(chartDom);
            
            // Data for individual pie chart (current category + all other categories)
            const data = [
                { name: item.name, value: item.value },
                { name: 'Other categories', value: total - item.value }
            ];
            
            // Calculate proportion of current category
            const proportion = ((item.value / total) * 100).toFixed(1) + '%';
            
            const option = {
                tooltip: {
                    trigger: 'item',
                    formatter: `
                        <div style="font-weight: bold;">{b}</div>
                        <div>Mention count: {c} times</div>
                        <div>Proportion of total: ${item.name === 'Other categories' ? ((100 - parseFloat(proportion)) + '%') : proportion}</div>
                        ${item.name !== 'Other categories' ? `<div>Mentioned in: ${item.docs}</div>` : ''}
                    `
                },
                legend: {
                    bottom: 0,
                    textStyle: { fontSize: 12 }
                },
                series: [
                    {
                        type: 'pie',
                        radius: '70%',
                        center: ['50%', '45%'],
                        data: data,
                        itemStyle: {
                            color: function(params) {
                                // Assign colors to current category and "Others"
                                return params.dataIndex === 0 ? item.color[0] : item.color[1];
                            },
                            borderColor: '#fff',
                            borderWidth: 1
                        },
                        label: {
                            show: true,
                            formatter: '{d}%', // Display percentage
                            fontSize: 14,
                            fontWeight: 'bold'
                        },
                        labelLine: {
                            show: true,
                            length: 15
                        }
                    }
                ]
            };
            
            myChart.setOption(option);
            // Responsive to window resizing
            window.addEventListener('resize', () => myChart.resize());
        });
    </script>
</body>
</html>
