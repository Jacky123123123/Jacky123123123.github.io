<!DOCTYPE html>
<html style="margin: 0; padding: 0;">
<head>
    <meta charset="UTF-8">
    <title>Arthritis Prevalence Data Visualization</title>
    <!-- 引入ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <style>
        /* 适配A4纸宽度，论文排版常用 */
        .chart-container {
            width: 100%;
            height: 300px;
            margin: 10px 0;
        }
    </style>
</head>
<body style="margin: 20px; font-family: Arial, sans-serif;">
    <!-- 图表标题（论文级别） -->
    <h3 style="text-align: center; font-size: 14px; font-weight: bold;">Prevalence of Osteoarthritis in Elderly Population</h3>
    
    <!-- 图表1：不同年龄段OA患病率 -->
    <div class="chart-container" id="ageChart"></div>
    
    <!-- 图表2：手OA性别患病率差异 -->
    <div class="chart-container" id="genderChart"></div>

    <script type="text/javascript">
        // 初始化图表1：年龄段OA患病率
        var ageChart = echarts.init(document.getElementById('ageChart'));
        var ageOption = {
            title: {
                text: 'OA Prevalence by Age Group',
                left: 'center',
                textStyle: { fontSize: 16 }
            },
            tooltip: {
                trigger: 'axis',
                formatter: '{b}: {c}%',
                textStyle: { fontSize: 16 }
            },
            grid: { left: '5%', right: '5%', bottom: '10%', top: '15%' },
            xAxis: {
                type: 'category',
                data: ['65+ years', '70+ years'],
                axisLabel: { fontSize: 16 },
                axisLine: { lineStyle: { color: '#333' } }
            },
            yAxis: {
                type: 'value',
                max: 100,
                name: 'Prevalence (%)',
                nameTextStyle: { fontSize: 16 },
                axisLabel: { 
                    formatter: '{value}%',
                    fontSize: 16 
                },
                axisLine: { lineStyle: { color: '#333' } },
                splitLine: { lineStyle: { type: 'dashed', color: '#ccc' } }
            },
            series: [
                {
                    name: 'Osteoarthritis Prevalence',
                    type: 'bar',
                    data: [
                        { value: 31, itemStyle: { color: '#4682B4' }, label: { show: true, position: 'top', fontSize: 10 } }, // 19.7%-42.3%取均值
                        { value: 90, itemStyle: { color: '#5F9EA0' }, label: { show: true, position: 'top', fontSize: 10 } }
                    ],
                    barWidth: '40%',
                    label: {
                        formatter: '{c}%',
                        color: '#000'
                    }
                }
            ],
            legend: { show: false }
        };
        ageChart.setOption(ageOption);

        // 初始化图表2：手OA性别差异
        var genderChart = echarts.init(document.getElementById('genderChart'));
        var genderOption = {
            title: {
                text: 'Hand OA Prevalence by Gender (UK Elderly)',
                left: 'center',
                textStyle: { fontSize: 16 }
            },
            tooltip: {
                trigger: 'axis',
                formatter: '{b}: {c}%',
                textStyle: { fontSize: 16 }
            },
            grid: { left: '5%', right: '5%', bottom: '10%', top: '15%' },
            xAxis: {
                type: 'category',
                data: ['Male', 'Female'],
                axisLabel: { fontSize: 16 },
                axisLine: { lineStyle: { color: '#333' } }
            },
            yAxis: {
                type: 'value',
                name: 'Prevalence (%)',
                nameTextStyle: { fontSize: 16 },
                axisLabel: { 
                    formatter: '{value}%',
                    fontSize: 16 
                },
                axisLine: { lineStyle: { color: '#333' } },
                splitLine: { lineStyle: { type: 'dashed', color: '#ccc' } }
            },
            series: [
                {
                    name: 'Hand OA Prevalence',
                    type: 'bar',
                    data: [
                        { value: 28, itemStyle: { color: '#6495ED' }, label: { show: true, position: 'top', fontSize: 10 } }, // 参考UK流行病学数据
                        { value: 45, itemStyle: { color: '#B0C4DE' }, label: { show: true, position: 'top', fontSize: 10 } }
                    ],
                    barWidth: '40%',
                    label: {
                        formatter: '{c}%',
                        color: '#000'
                    }
                }
            ],
            legend: { show: false }
        };
        genderChart.setOption(genderOption);

        // 响应式适配
        window.addEventListener('resize', function() {
            ageChart.resize();
            genderChart.resize();
        });
    </script>
</body>
</html>
