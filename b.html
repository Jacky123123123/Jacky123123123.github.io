<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车页面 (b页)</title>
    <!-- 引入Iconify（图标）和Tailwind（样式） -->
    <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <h1 class="text-2xl font-bold mb-8">我的购物车</h1>

    <!-- 购物车为空的提示 -->
    <div id="emptyCart" class="text-center py-12 hidden">
        <iconify-icon icon="lucide:shopping-cart" class="text-6xl text-gray-300 mx-auto"></iconify-icon>
        <p class="mt-4 text-gray-500">购物车为空，快去挑选商品吧！</p>
        <a href="a.html" class="mt-4 inline-block bg-[#FF7E00] text-white px-6 py-2 rounded-xl font-bold hover:bg-[#e67000] transition-colors">
            返回商品页
        </a>
    </div>

    <!-- 购物车列表 -->
    <div id="cartList" class="space-y-4 mb-8 hidden">
        <!-- 购物车商品项会通过JS动态生成 -->
    </div>

    <!-- 购物车总价 -->
    <div id="cartTotal" class="border-t pt-4 mt-4 hidden">
        <div class="flex justify-between items-center">
            <span class="font-bold text-lg">总计：</span>
            <span id="totalPrice" class="font-bold text-xl text-[#FF7E00]">$0.00</span>
        </div>
        <button onclick="clearCart()" class="mt-4 bg-red-500 text-white px-6 py-2 rounded-xl font-bold hover:bg-red-600 transition-colors">
            <iconify-icon icon="lucide:trash-2" class="inline-block mr-2"></iconify-icon>
            清空购物车
        </button>
        <a href="a.html" class="mt-4 ml-4 inline-block bg-gray-200 text-gray-800 px-6 py-2 rounded-xl font-bold hover:bg-gray-300 transition-colors">
            返回继续购物
        </a>
    </div>

    <script>
        // 购物车存储key（必须和a页完全一致！）
        const CART_STORAGE_KEY = 'userCartItems';

        // 页面加载时渲染购物车
        window.onload = function() {
            renderCart();
        };

        // 渲染购物车核心函数
        function renderCart() {
            try {
                // 读取本地购物车数据
                let cartItems = localStorage.getItem(CART_STORAGE_KEY);
                cartItems = cartItems ? JSON.parse(cartItems) : [];

                const cartListEl = document.getElementById('cartList');
                const emptyCartEl = document.getElementById('emptyCart');
                const cartTotalEl = document.getElementById('cartTotal');
                const totalPriceEl = document.getElementById('totalPrice');

                // 判断购物车是否为空
                if (cartItems.length === 0) {
                    emptyCartEl.classList.remove('hidden');
                    cartListEl.classList.add('hidden');
                    cartTotalEl.classList.add('hidden');
                    return;
                }

                // 显示购物车列表和总价
                emptyCartEl.classList.add('hidden');
                cartListEl.classList.remove('hidden');
                cartTotalEl.classList.remove('hidden');

                // 清空列表，重新渲染
                cartListEl.innerHTML = '';
                let total = 0;

                // 遍历购物车商品，生成DOM
                cartItems.forEach((item, index) => {
                    // 计算单商品总价
                    const itemTotal = item.price * item.quantity;
                    total += itemTotal;

                    // 创建商品项DOM
                    const cartItemEl = document.createElement('div');
                    cartItemEl.className = 'flex items-center gap-4 p-4 bg-white rounded-xl border border-gray-100';
                    cartItemEl.innerHTML = `
                        <img src="${item.image}" alt="${item.name}" class="w-20 h-20 object-cover rounded-lg">
                        <div class="flex-1">
                            <h4 class="font-bold">${item.name}</h4>
                            <p class="text-gray-500">$${item.price.toFixed(2)}/件</p>
                            <div class="flex items-center gap-2 mt-2">
                                <button onclick="changeQuantity(${index}, -1)" class="w-8 h-8 flex items-center justify-center border border-gray-200 rounded hover:bg-gray-50">-</button>
                                <span>${item.quantity}</span>
                                <button onclick="changeQuantity(${index}, 1)" class="w-8 h-8 flex items-center justify-center border border-gray-200 rounded hover:bg-gray-50">+</button>
                                <button onclick="removeItem(${index})" class="ml-4 text-red-500 text-sm hover:text-red-600">
                                    <iconify-icon icon="lucide:trash-2"></iconify-icon> 删除
                                </button>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-bold">$${itemTotal.toFixed(2)}</p>
                        </div>
                    `;
                    cartListEl.appendChild(cartItemEl);
                });

                // 更新总价显示
                totalPriceEl.textContent = `$${total.toFixed(2)}`;

            } catch (error) {
                console.error('渲染购物车失败：', error);
                alert('加载购物车失败，请稍后重试！');
            }
        }

        // 修改商品数量
        function changeQuantity(index, change) {
            let cartItems = localStorage.getItem(CART_STORAGE_KEY);
            cartItems = cartItems ? JSON.parse(cartItems) : [];

            // 数量不能小于1
            if (cartItems[index].quantity + change < 1) {
                alert('商品数量不能小于1！');
                return;
            }

            // 修改数量
            cartItems[index].quantity += change;
            // 保存并重新渲染
            localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cartItems));
            renderCart();
        }

        // 删除单个商品
        function removeItem(index) {
            if (!confirm('确定要删除该商品吗？')) return;
            
            let cartItems = localStorage.getItem(CART_STORAGE_KEY);
            cartItems = cartItems ? JSON.parse(cartItems) : [];

            // 删除对应索引的商品
            cartItems.splice(index, 1);
            // 保存并重新渲染
            localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cartItems));
            renderCart();
        }

        // 清空购物车
        function clearCart() {
            if (!confirm('确定要清空购物车吗？')) return;
            
            localStorage.removeItem(CART_STORAGE_KEY);
            renderCart();
            alert('购物车已清空！');
        }
    </script>
</body>
</html>
